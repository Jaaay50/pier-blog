<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>沉光 · BIOLUME</title>
<style>
:root { --ink: #dce8f2; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: #010407; color: var(--ink);
  font-family: "Avenir Next", "Futura", "PingFang SC", "Noto Sans SC", sans-serif;
  -webkit-font-smoothing: antialiased;
  touch-action: none;
}
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }

/* ---------- 开场 ---------- */
#start-mask {
  position: fixed; inset: 0; z-index: 100;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at 50% 130%, #07131f 0%, #010407 72%);
  transition: opacity 2.4s ease;
}
#start-mask.hidden { opacity: 0; pointer-events: none; }
#start-mask h1 {
  font-size: clamp(2.2rem, 6vw, 3.4rem); font-weight: 300;
  letter-spacing: 0.62em; text-indent: 0.62em;
  text-shadow: 0 0 42px rgba(92,170,255,0.35);
}
#start-mask .en {
  margin-top: 1rem; font-size: 0.66rem; letter-spacing: 0.55em; text-indent: 0.55em; opacity: 0.5;
}
#start-mask .desc {
  margin-top: 2.6rem; font-size: 0.68rem; letter-spacing: 0.28em; text-indent: 0.28em;
  opacity: 0.4; line-height: 2.2; text-align: center;
}
#time-picker { display: flex; gap: 0.7rem; margin-top: 2.7rem; }
.time-opt {
  padding: 0.55rem 1.35rem; font: inherit; font-size: 0.68rem; letter-spacing: 0.28em; text-indent: 0.28em;
  color: var(--ink); background: rgba(255,255,255,0.03);
  border: 1px solid rgba(160,200,255,0.14); border-radius: 999px;
  cursor: pointer; opacity: 0.5; transition: all 0.35s;
}
.time-opt:hover { opacity: 0.85; }
.time-opt.on { opacity: 1; background: rgba(110,180,255,0.10); border-color: rgba(140,200,255,0.45); }
#dive-btn {
  margin-top: 2.4rem; padding: 0.95rem 2.6rem 0.95rem 2.9rem;
  font: inherit; font-size: 0.78rem; letter-spacing: 0.42em;
  color: var(--ink); background: rgba(110,180,255,0.06);
  border: 1px solid rgba(150,205,255,0.32); border-radius: 999px;
  cursor: pointer; transition: all 0.4s; backdrop-filter: blur(4px);
}
#dive-btn:hover { letter-spacing: 0.52em; background: rgba(110,180,255,0.13); }
#err {
  display: none; margin-top: 2rem; max-width: 74%; font-size: 0.7rem; line-height: 1.9;
  letter-spacing: 0.12em; opacity: 0.8; color: #ffb0a0; text-align: center; white-space: pre-wrap;
}

/* ---------- HUD ---------- */
.hud { position: fixed; z-index: 20; user-select: none; pointer-events: none; opacity: 0; transition: opacity 2.4s ease 1.2s; }
body.diving .hud { opacity: 1; }
#mark { top: 26px; left: 4vw; font-size: 11px; letter-spacing: 0.4em; font-weight: 600; text-shadow: 0 0 18px rgba(0,0,0,0.9); }
#mark small { display: block; margin-top: 7px; font-size: 8.5px; letter-spacing: 0.34em; opacity: 0.45; font-weight: 400; }
#meter { top: 26px; right: 4vw; text-align: right; text-shadow: 0 0 18px rgba(0,0,0,0.9); }
#meter .d {
  font-size: clamp(1.5rem, 3vw, 2.1rem); font-weight: 200; letter-spacing: 0.06em;
  font-variant-numeric: tabular-nums; opacity: 0.85;
}
#meter .z { margin-top: 5px; font-size: 9px; letter-spacing: 0.32em; opacity: 0.5; }
#hint {
  left: 50%; bottom: 4.5vh; transform: translateX(-50%);
  font-size: 9.5px; letter-spacing: 0.3em; text-indent: 0.3em; opacity: 0;
  transition: opacity 2s ease 3s; white-space: nowrap;
}
body.diving #hint { opacity: 0.4; }
body.diving.moved #hint { opacity: 0; transition: opacity 1.4s ease; }

/* ---------- 诗句 ---------- */
#verse {
  position: fixed; left: 50%; bottom: 10vh; transform: translateX(-50%);
  z-index: 20; max-width: 84vw; text-align: center;
  font-size: clamp(0.78rem, 1.6vw, 0.95rem); font-weight: 300;
  letter-spacing: 0.34em; text-indent: 0.34em; line-height: 2;
  opacity: 0; transition: opacity 2.4s ease;
  text-shadow: 0 0 24px rgba(0,0,0,0.9);
  pointer-events: none; white-space: nowrap;
}
#verse.show { opacity: 0.85; }
#verse::after {
  content: ""; display: block; margin: 14px auto 0; height: 1px; width: 0;
  background: currentColor; opacity: 0.35; transition: width 3s ease;
}
#verse.show::after { width: 56%; }

/* ---------- 退出 ---------- */
#exit-btn {
  position: fixed; top: 22px; left: 50%; transform: translateX(-50%);
  z-index: 30; padding: 0.42rem 1.2rem 0.42rem 1.3rem;
  font: inherit; font-size: 9.5px; letter-spacing: 0.32em; text-indent: 0.32em;
  color: var(--ink); background: rgba(8,18,32,0.42);
  border: 1px solid rgba(150,205,255,0.26); border-radius: 999px;
  cursor: pointer; backdrop-filter: blur(6px);
  opacity: 0; pointer-events: none; transition: opacity 1.2s ease, background 0.35s;
}
#exit-btn:hover { background: rgba(110,180,255,0.16); }
body.diving #exit-btn { opacity: 0.55; pointer-events: auto; }
body.diving #exit-btn:hover { opacity: 1; }
body.diving.moved.hideui #exit-btn { opacity: 0; pointer-events: none; }

@media (max-width: 768px) {
  #mark { left: 5vw; } #meter { right: 5vw; }
  #verse, #hint { white-space: normal; }
}
</style>
</head>
<body>

<canvas id="gl"></canvas>

<div id="start-mask">
  <h1>沉　光</h1>
  <div class="en">BIOLUME · A PROCEDURAL DESCENT</div>
  <div class="desc">从月光触及的水面，下潜到光的尽头<br>移动光标环顾 · 按住点亮探照灯 · 滚轮控制潜速</div>
  <div id="time-picker">
    <button class="time-opt on" data-t="night">月夜</button>
    <button class="time-opt" data-t="dusk">暮色</button>
    <button class="time-opt" data-t="dawn">黎明</button>
  </div>
  <button id="dive-btn">潜入 →</button>
  <div id="err"></div>
</div>

<div class="hud" id="mark">沉光 BIOLUME<small id="diveNo">DIVE 01</small></div>
<div class="hud" id="meter"><div class="d">0 m</div><div class="z">SURFACE</div></div>
<div class="hud" id="hint">移动光标环顾 · 按住点亮探照灯 · 滚轮控制潜速</div>
<div id="verse"></div>
<button id="exit-btn" title="返回作品集 (Esc)">← 返回作品集</button>

<script>
'use strict';
/* =========================================================
   沉光 · BIOLUME — 第二章：介质
   零依赖 · 单文件 · 原生 WebGL2
   水体 = 逐步 raymarch 体积散射（RGB Beer-Lambert）
   非均匀介质 / 波浪光腿 / 焦散 / 探照灯 / 生物发光 / 巨影
   ========================================================= */

// ---------- 状态 ----------
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const S = {
  started: false,
  paused: false,
  t: 0,
  depth: 0,
  vMul: 1,                 // 滚轮临时倍率（回弹到 1）
  yaw: 0, pitch: 0,
  tYaw: 0, tPitch: 0,
  torch: 0, tTorch: 0,     // 探照灯亮度（0..1）
  torchYaw: 0, torchPitch: 0,
  flowX: 0, flowY: 0,      // 指针速度注入的水流（低通+惯性）
  fov: 1.35, tFov: 1.35,
  stretch: 0,              // 冲刺时雪拉线
  timeMode: 'night',
  lastFrame: performance.now(),
  lastInput: performance.now(),
  frameAvg: 16.7,
  quality: 2,              // 2 高 / 1 中 / 0 低
  qTimer: 0,
};

// 时刻参数
const TIMES = {
  night: { sun: [0.62,0.82,1.00], amb: [0.30,0.52,0.85], glint: [0.92,0.96,1.00], tilt: [0.16,0.07],  power: 1.00 },
  dusk:  { sun: [1.00,0.66,0.38], amb: [0.55,0.36,0.42], glint: [1.00,0.60,0.28], tilt: [0.44,0.12],  power: 1.10 },
  dawn:  { sun: [0.95,0.88,0.72], amb: [0.42,0.50,0.66], glint: [1.00,0.92,0.70], tilt: [0.32,-0.15], power: 1.02 },
};

const ZONES = [
  { d: 0,    n: 'SUNLIGHT · 透光层' },
  { d: 200,  n: 'TWILIGHT · 暮光层' },
  { d: 1000, n: 'MIDNIGHT · 午夜层' },
  { d: 4000, n: 'ABYSS · 深渊平原' },
];

const VERSES = [
  { d: 14,   t: '你离开了空气的国度' },
  { d: 46,   t: '红色最先告别——它在十五米处溺水' },
  { d: 130,  t: '光开始变得昂贵' },
  { d: 210,  t: '−200m · 透光层之底，植物到此为止' },
  { d: 460,  t: '绿光也交出了它的波长' },
  { d: 740,  t: '这里的蓝，是光最后的遗嘱' },
  { d: 1020, t: '−1000m · 最后一个光子死在这里' },
  { d: 1600, t: '从此，光只属于生命' },
  { d: 2700, t: '寂静有重量——雪落了一万年' },
  { d: 4020, t: '−4000m · 深渊平原，比月背更少人抵达' },
];
VERSES.forEach(v => v.shown = false);

// ---------- WebGL 初始化 ----------
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, powerPreference: 'high-performance' });

const errBox = document.getElementById('err');
const verseEl = document.getElementById('verse');
function fatal(msg) {
  errBox.style.display = 'block';
  errBox.textContent = msg;
  const b = document.getElementById('dive-btn'); if (b) b.style.display = 'none';
  throw new Error(msg);
}
if (!gl) fatal('这片海需要 WebGL2 才能发光。\n请更换支持 WebGL2 的浏览器（Chrome / Edge / Safari 16+）。');

canvas.addEventListener('webglcontextlost', e => {
  e.preventDefault();
  verseEl.textContent = '海流切断了光——请刷新页面重新下潜';
  verseEl.classList.add('show');
});

const IS_MOBILE = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || navigator.maxTouchPoints > 2;
const DPR_TABLE = IS_MOBILE ? [1, 1.2, 1.5] : [1, 1.5, 2];
let W = 0, H = 0, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, DPR_TABLE[S.quality]);
  W = canvas.width  = Math.max(2, Math.round(innerWidth  * dpr));
  H = canvas.height = Math.max(2, Math.round(innerHeight * dpr));
  gl.viewport(0, 0, W, H);
}
addEventListener('resize', resize);
resize();

function sh(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) fatal('Shader 编译失败：\n' + gl.getShaderInfoLog(s));
  return s;
}
function prog(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) fatal('链接失败：\n' + gl.getProgramInfoLog(p));
  return p;
}
function locs(p, names) {
  const o = {};
  for (const n of names) o[n] = gl.getUniformLocation(p, n);
  return o;
}

// 全屏三角形
const quadVAO = gl.createVertexArray();
gl.bindVertexArray(quadVAO);
const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
gl.bindVertexArray(null);

/* =========================================================
   PASS 1 — 水体：raymarch 体积散射
   世界单位 ≈ 6 米；相机在原点；介质随深度流动
   ========================================================= */
const quadVS = `#version 300 es
layout(location=0) in vec2 aP;
void main(){ gl_Position = vec4(aP, 0.0, 1.0); }`;

const waterFS = `#version 300 es
precision highp float;
out vec4 o;
uniform vec2  uRes;
uniform float uT;
uniform float uDepth;        // 米
uniform float uYaw, uPitch;
uniform float uFov;
uniform vec3  uSun, uAmb, uGlint;
uniform vec2  uTilt;
uniform float uPower;
uniform int   uSteps;
uniform vec2  uFlow;         // 水流扰动
uniform float uTorch;        // 探照灯 0..1
uniform vec3  uTorchDir;     // 世界空间
uniform vec3  uTorchPos;     // 世界空间（手持偏置）
uniform vec4  uWhale;        // progress, active, size, yOff
uniform float uWhaleSide;    // 1 / -1
uniform float uBioWave;      // 深渊集群发光波 0..1
uniform float uBioT;         // 波前进度 0..1（0=左缘外，1=右缘外）

// ---- 噪声 ----
float h21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float h31(vec3 p){ p=fract(p*vec3(113.5,271.9,124.6)); p+=dot(p,p.zxy+31.32); return fract((p.x+p.y)*p.z); }
float n2(vec2 p){
  vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),
             mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x), f.y);
}
float fbm2(vec2 p){
  float s=0.0, a=0.55; mat2 m=mat2(1.6,1.2,-1.2,1.6);
  for(int i=0;i<3;i++){ s+=a*n2(p); p=m*p; a*=0.5; }
  return s;
}
float n3(vec3 p){
  vec3 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  float a=mix(mix(h31(i),h31(i+vec3(1,0,0)),f.x), mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x), f.y);
  float b=mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x), mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x), f.y);
  return mix(a,b,f.z);
}
float fbm3(vec3 p){
  return 0.62*n3(p) + 0.38*n3(p*2.4 + 11.7);
}

// ---- 视线 ----
vec3 rayDir(vec2 uv){
  vec3 d = normalize(vec3(uv.x, uv.y, -uFov));
  float cy=cos(uYaw),  sy=sin(uYaw);
  float cp=cos(uPitch),sp=sin(uPitch);
  d = mat3(1,0,0, 0,cp,-sp, 0,sp,cp) * d;
  d = mat3(cy,0,sy, 0,1,0, -sy,0,cy) * d;
  return normalize(d);
}

// ---- 物理常量（每世界单位，1 单位≈6m） ----
const vec3 EXT = vec3(0.34, 0.115, 0.060);      // 消光（红先死）
const vec3 ALB = vec3(0.18, 0.42, 0.62);        // 散射反照率（蓝绿占优）
const vec3 SUNDECAY = vec3(0.056, 0.013, 0.0028);  // 直射衰减 / 米（红先死）
const vec3 AMBDECAY = vec3(0.024, 0.0060, 0.0017); // 环境场感知衰减 / 米
const float BOOST = 16.0;                       // 内散射能量补偿

float phaseHG(float c, float g){
  float g2 = g*g;
  return 0.0796 * (1.0-g2) / pow(1.0+g2-2.0*g*c, 1.5);
}

// 焦散网纹（水面聚焦），坐标为水面投影
float caustic(vec2 p, float t){
  float a = fbm2(p*1.35 + vec2(t*0.31, -t*0.23));
  float b = fbm2(p*1.85 - vec2(t*0.17, t*0.26) + a*1.7);
  float r = 1.0 - abs(2.0*b - 1.0);
  return pow(max(r, 0.0), 5.0);
}

// 巨影：屏幕空间柔边剪影（身体+尾鳍），返回遮挡量 0..1
float whale(vec2 uv, float t){
  if (uWhale.y < 0.001) return 0.0;
  float pr = uWhale.x;
  float px = mix(1.75, -1.75, pr) * uWhaleSide;
  float sway = sin(pr*9.0 + 1.7) * 0.035;
  vec2 c = uv - vec2(px, uWhale.w + sway);
  c.x *= uWhaleSide;
  // 身体：拉长椭圆
  vec2 b = c; b.x *= 0.42; b.y *= 1.55;
  float body = length(b) - uWhale.z*0.42;
  // 尾部：向后收细 + 摆动
  float tailX = c.x + uWhale.z*1.9;
  float tailSway = sin(t*1.1 + pr*14.0) * 0.10 * smoothstep(0.0, -uWhale.z*2.2, c.x - uWhale.z*0.4);
  float tail = abs(c.y - tailSway) - mix(uWhale.z*0.34, 0.015, smoothstep(uWhale.z*1.2, -uWhale.z*2.1, c.x));
  tail = max(tail, c.x - uWhale.z*0.9);
  tail = max(tail, -tailX);
  float d = min(body, tail);
  // 边缘有机扰动
  d += (fbm2(c*6.0 + t*0.12) - 0.5) * 0.035;
  return smoothstep(0.028, -0.02, d);
}

void main(){
  vec2 uv = (gl_FragCoord.xy*2.0 - uRes) / uRes.y;
  vec3 rd = rayDir(uv);
  float t = uT;

  vec3 L = normalize(vec3(uTilt.x, 1.0, uTilt.y));
  float mu = dot(rd, L);

  // 太阳到达此深度的透射色：颜色随深度物理演变
  vec3 sunT = exp(-SUNDECAY * uDepth) * uSun * uPower;
  float depth01  = clamp(uDepth/1000.0, 0.0, 1.0);
  float shallow  = 1.0 - smoothstep(0.0, 220.0, uDepth);    // 焦散区
  float twilight = 1.0 - smoothstep(150.0, 1050.0, uDepth); // 光腿区
  float abyss    = smoothstep(2600.0, 4200.0, uDepth);

  // 巨影遮挡（在光路上）
  float wh = whale(uv, t);
  float sunBlock = 1.0 - wh*0.88;

  // ---------- 环境项（多次散射近似，向上亮向下暗） ----------
  float upness = rd.y*0.5 + 0.5;
  vec3 ambCol = uAmb * uPower * mix(0.10, 1.0, pow(upness, 1.4));
  ambCol *= exp(-AMBDECAY * uDepth);
  // 中层残光：“最后的蓝”，1000m 前可感知；深渊另留极微底色
  ambCol += vec3(0.008, 0.022, 0.050) * exp(-uDepth*0.0012) * uPower * mix(0.55, 1.0, upness);
  ambCol += vec3(0.0015, 0.004, 0.009) * exp(-uDepth*0.0003) * uPower;
  // 暗适应底光：人眼在深海会放大残余信号，深渊不纯黑
  ambCol += vec3(0.0022, 0.0058, 0.0135) * (0.6 + 0.4*upness);

  // ---------- raymarch ----------
  float jitter = h21(gl_FragCoord.xy + fract(t)*7.13);
  vec3 acc = vec3(0.0);
  vec3 trans = vec3(1.0);
  float phF = phaseHG(mu, 0.72);
  float phU = 0.12;
  float vGrad = mix(0.30, 1.0, upness);          // 光自上方：向上看雾更亮

  // 介质流动：下潜掠过 + 慢漂 + 指针水流
  vec3 drift = vec3(uFlow.x*2.6 + t*0.045, uDepth*0.148, uFlow.y*2.6 - t*0.032);

  float tPrev = 0.35;
  for (int i = 0; i < 16; i++){
    if (i >= uSteps) break;
    float fi = (float(i) + jitter) / float(uSteps);
    float tc = 0.35 + 30.0 * fi*fi;              // 近密远疏
    float stepLen = tc - tPrev; tPrev = tc;
    vec3 p = rd * tc;
    vec3 np = p * 0.062 + drift;

    // 非均匀介质：大尺度团块 × 雾团 × 细碎
    float raw = fbm3(np);
    float dens = 0.052 * (0.42 + 1.15 * raw * raw * 1.7);
    dens *= 0.62 + 0.76 * n3(np*0.33 + 5.1);     // 低频团块调制
    dens *= 1.0 + 0.55*twilight*(1.0-shallow);   // 暮光层雾最浓
    dens *= 1.0 - abyss*0.35;                    // 深渊更清冷

    // 光腿：波浪调制（投影回水面平面）
    vec2 gc = (p.xz - L.xz * (p.y / max(L.y, 0.4))) * 0.30;
    float legsN = fbm2(gc*1.9 + vec2(t*0.10, t*0.075));
    float sharp = mix(3.4, 1.1, depth01);
    float legs = pow(smoothstep(0.30, 0.92, legsN), sharp) * 1.5;
    legs = mix(legs, 0.50, depth01*0.6);

    // 浅层焦散残影落在介质上
    float ca = caustic(gc*2.6, t) * shallow * exp(-tc*0.10) * 1.6;

    // 太阳内散射（穿过介质到该点的距离衰减 + 能量补偿）
    vec3 sunHere = sunT * sunBlock * exp(-EXT * tc * 0.55) * (legs + ca) * twilight * BOOST * vGrad;
    acc += sunHere * (phF*1.5 + phU) * ALB * dens * stepLen * trans;

    // 探照灯：手持偏置锥形光束（能看见光锥本体）
    if (uTorch > 0.003){
      vec3 w = p - uTorchPos;
      float ax = dot(w, uTorchDir);
      if (ax > 0.05){
        float rr = length(w - ax*uTorchDir);
        float ang = rr / ax;
        float cone = exp(-ang*ang*10.0) + exp(-ang*ang*110.0)*1.3;
        float att = exp(-ax*0.10);
        vec3 tCol = vec3(1.0, 0.94, 0.82) * 3.4 * uTorch;
        acc += tCol * cone * att * ALB * (dens*9.0+0.14) * stepLen * trans;
      }
    }

    // 深渊生物光雾：波前带内介质泛青（与粒子波前同步沿 x 扫过）
    if (uBioWave > 0.003){
      float bwBand = exp(-pow((p.x/15.0 - mix(-1.1, 1.1, uBioT))*3.4, 2.0));
      float bw = fbm3(np*1.7 + vec3(0.0, t*0.06, 0.0));
      acc += vec3(0.05, 0.32, 0.30) * uBioWave * bwBand * (0.14 + bw*bw*0.8) * (dens*2.0 + 0.003) * stepLen * trans * abyss;
    }

    trans *= exp(-EXT * dens * stepLen * 3.1);
  }

  // ---------- 背景（视线穿透介质后的极限） ----------
  vec3 bg = ambCol;
  // 向上：水面 Snell 亮区 + 波光
  if (rd.y > 0.05 && shallow > 0.001){
    float up = rd.y;
    vec2 sp2 = rd.xz / max(up, 0.09) * 2.0;
    float glint = caustic(sp2*0.9, t) + fbm2(sp2*2.6 - vec2(t*0.14, t*0.2))*0.4;
    float snell = smoothstep(0.42, 0.9, up);
    bg += (uGlint * glint * 1.5 + uSun*0.55) * snell * shallow * uPower;
    bg += uGlint * glint * 0.30 * shallow * pow(up, 1.4);
  }
  // 太阳方向的整体辉光 + 屏幕空间光柱（被巨影遮挡）
  float glow = pow(max(mu, 0.0), 5.0);
  bg += sunT * glow * 2.2 * twilight * sunBlock;
  bg += sunT * pow(max(rd.y*0.62+0.40, 0.0), 2.2) * 1.1 * twilight * sunBlock;
  vec2 shaftC = rd.xz / max(rd.y*0.5+0.55, 0.15);
  float stripes = fbm2(shaftC*2.1 + vec2(0.0, -t*0.22));
  stripes = 0.25 + 1.15*smoothstep(0.30, 0.95, stripes);
  bg += sunT * pow(max(mu, 0.0), 3.2) * stripes * 3.4 * twilight * sunBlock;

  // 介质大尺度斑驳（非均匀水团，抗“干净渐变”）
  bg *= 0.84 + 0.36*fbm2(rd.xy*2.4 + vec2(t*0.02, uDepth*0.0011));

  // 巨影本体：挡掉背景，留边缘透光
  bg *= 1.0 - wh*0.82;

  vec3 col = acc + bg * trans;

  // 巨影轮廓微光（逆光边缘散射）
  if (wh > 0.001 && wh < 0.995){
    col += sunT * wh*(1.0-wh) * 3.0 * twilight;
  }

  // ---------- 收尾 ----------
  // 不对称柔和暗角（弱，避免舷窗感）
  vec2 vg = uv * vec2(0.72, 0.94);
  col *= 1.0 - 0.10*dot(vg,vg) - 0.03*smoothstep(0.2, 1.6, -uv.y);

  // 散射致白（轻度去饱和，防合成蓝）
  float luma = dot(col, vec3(0.299,0.587,0.114));
  col = mix(col, vec3(luma), 0.08);

  // 深度冷偏
  col = mix(col, col.bbb*vec3(0.55,0.75,1.0), depth01*0.16);

  // ACES 近似
  col *= 1.32;
  col = (col*(2.51*col+0.03))/(col*(2.43*col+0.59)+0.14);
  col = pow(max(col, 0.0), vec3(0.90));

  // 抖动去色带
  float dth = (h21(gl_FragCoord.xy + fract(t*3.7)) - 0.5) / 145.0;
  col += dth;

  o = vec4(col, 1.0);
}`;

  float depthThin = 1.0 - smoothstep(3200.0, 6000.0, uDepth)*0.6;
  vA = distFade * depthThin * (0.5 + 0.5*min(aSize,1.0)) * (amb + tg);
  vSeed = aPhase;
  vStr = uStretch * clamp(-v.z*0.12, 0.2, 1.0);
}`;

const bioVS = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in float aPhase;
layout(location=2) in float aSeed;
uniform vec2  uRes;
uniform float uT, uFall, uYaw, uPitch, uDepth, uBox, uFov;

uniform float uPokeT;        // 距上次指针大动作的时间
uniform float uBioWave;
uniform float uBioT;
uniform float uRM;
out float vA;
out vec3 vC;
out float vSeed;

mat3 rotView(){
  float cy=cos(uYaw), sy=sin(uYaw), cp=cos(uPitch), sp=sin(uPitch);
  mat3 ry = mat3(cy,0,-sy, 0,1,0, sy,0,cy);
  mat3 rx = mat3(1,0,0, 0,cp,sp, 0,-sp,cp);
  return rx * ry;
}

void main(){
  vec3 p = aPos;
  float fall = (uFall*0.45 + aPhase*5.0);
  float span = uBox*2.6;
  p.y = mod(aPos.y - fall, span) - span*0.5;
  p.x += sin(uT*0.07 + aPhase*9.0) * 3.2;
  p.z += cos(uT*0.05 + aPhase*7.0) * 2.8;

  vec3 v = rotView() * p;
  if (v.z > -0.2) v.z = -0.2;
  float aspect = uRes.x/uRes.y;
  gl_Position = vec4(v.x*uFov/aspect, v.y*uFov, v.z*0.02, -v.z);

  float rate = mix(0.22, 0.9, fract(aSeed*7.31)) * mix(1.0, 0.55, uRM);
  float steady = step(fract(aSeed*9.17), 0.30);
  float breath = pow(sin(uT*rate + aPhase*11.0)*0.5+0.5, 2.2);
  float br = mix(breath, 0.42 + 0.58*breath, steady);
  float burst = step(0.986, fract(sin(floor(uT*0.5 + aSeed*43.0))*43758.5)) * pow(fract(-uT*0.5), 2.0)*2.0;
  br = br + burst*(1.0-uRM);

  // 深渊集群波：真实空间波前沿 x 扫过，命中处提亮并留相位闪烁
  float wc = p.x / (uBox*1.35);
  float wBand = exp(-pow((wc - mix(-1.1, 1.1, uBioT))*2.8, 2.0));
  br += uBioWave * wBand * (2.4 + 3.2*pow(sin(aPhase*3.0 + uT*2.3)*0.5+0.5, 2.0));

  float aim = max(dot(dirW, uPokeDir), 0.0);
  float near = smoothstep(0.988, 0.9985, aim);
  float spike = near * exp(-uPokeT*2.2) * 3.0;
  float scare = 1.0 - near * smoothstep(0.4, 1.6, uPokeT) * smoothstep(6.0, 2.0, uPokeT);
  br = (br*scare + spike);

  // 深度门控：250m 渐入，650m 后全强（提晨微光生物）
  float gate = smoothstep(250.0, 650.0, uDepth);
  float distFade = smoothstep(uBox*2.5, 4.0, -v.z);

  gl_PointSize = clamp(sz * (1.0 + wBand*uBioWave*0.55) * (uRes.y/900.0) / (-v.z*0.06+1.0), 1.0, 96.0);

  float hue = fract(aSeed*5.13);
  vC = hue < 0.06 ? vec3(1.0, 0.86, 0.62)

     : vec3(0.36, 0.62, 1.0);
  vSeed = aSeed;
}`;

/* =========================================================

function currentZone(d){
  let z = ZONES[0];

}
function descentSpeed(d){
  const s = d < 200 ? 7.5 : d < 1000 ? 6.0 : d < 2600 ? 4.2 : d < 4000 ? 2.6 : 1.4;
  return s * (RM ? 0.6 : 1);
}
function snowTint(d){
  const t = Math.min(d/2500, 1);
  return [ 0.74 - t*0.26, 0.81 - t*0.20, 0.90 - t*0.08 ];

// 世界空间方向（复刻 shader rayDir）
function rotCam(x, y, z, yaw, pitch){
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const y2 = cp*y - sp*z, z2 = sp*y + cp*z;
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  return [cy*x + sy*z2, y2, -sy*x + cy*z2];
}
function dirFromNdc(nx, ny, yaw, pitch){
  let x = nx * (W/H), y = ny, z = -S.fov;

/* =========================================================
   主循环
   ========================================================= */
gl.enable(gl.BLEND);
gl.disable(gl.DEPTH_TEST);

function frame(now){
  requestAnimationFrame(frame);
  if (S.paused) return;

  const rawDt = Math.min((now - S.lastFrame)/1000, 0.05);
  S.lastFrame = now;
  S.frameAvg = S.frameAvg*0.94 + (rawDt*1000)*0.06;
  S.t += rawDt;

  // 自适应降质（只降不升，避免震荡）
  if (S.frameAvg > 30 && S.quality > 0){
    S.qTimer += rawDt;
    if (S.qTimer > 2.5){ S.quality--; S.qTimer = 0; resize(); }
  } else S.qTimer = Math.max(0, S.qTimer - rawDt);

  if (!S.started){ renderScene(); return; }

  // ---- 下潜 ----
  const base = descentSpeed(S.depth);
  S.vMul += (1 - S.vMul) * 0.04;
  S.depth += base * S.vMul * rawDt * 1.4;
  snowFall += base * S.vMul * rawDt * 0.9;

  // ---- 姿态 / 探照灯 / 水流：低通 ----
  const idle = (now - S.lastInput) / 1000 > 12;
  if (idle){
    // 自动巡航微摆
    S.tYaw = Math.sin(S.t*0.05) * 0.07;
    S.tPitch = Math.sin(S.t*0.037+1.3) * 0.05;
    S.tTorch = 0;
  }
  S.yaw   += (S.tYaw   - S.yaw)   * 0.045;
  S.pitch += (S.tPitch - S.pitch) * 0.045;
  S.torch += (S.tTorch - S.torch) * 0.06;
  S.torchYaw   += (S.tYaw*1.12   - S.torchYaw)   * 0.028;  // 更慢 → 与视线分离
  S.torchPitch += (S.tPitch*1.12 - S.torchPitch) * 0.028;
  S.flowX *= 0.955; S.flowY *= 0.955;

  // 冲刺：FOV 收缩 + 拉线
  const sprint = Math.max(0, S.vMul - 1.45);
  S.tFov = 1.35 + Math.min(sprint*0.11, 0.22);
  S.fov += (S.tFov - S.fov) * 0.05;
  const strTarget = RM ? 0 : Math.min(sprint*0.5, 1);
  S.stretch += (strTarget - S.stretch) * 0.07;

  pokeT += rawDt;

  // ---- 巨影调度：400–1050m，每潜最多 2 次 ----
  if (!whaleEv.active && whaleEv.count < 2 && S.depth > 400 && S.depth < 1050 && S.t > whaleEv.nextAt){
    whaleEv.active = 1; whaleEv.prog = 0; whaleEv.count++;
    whaleEv.side = Math.random() < 0.5 ? 1 : -1;
    whaleEv.size = 0.42 + Math.random()*0.22;
    whaleEv.yOff = -0.05 + Math.random()*0.35;
  }
  if (whaleEv.active){
    whaleEv.prog += rawDt / (RM ? 34 : 26);
    if (whaleEv.prog >= 1){ whaleEv.active = 0; whaleEv.nextAt = S.t + 24 + Math.random()*18; }
  }

  // ---- 深渊集群波 ----
  if (S.depth > 2600){
    if (bioWave <= 0 && S.t > bioWaveNext){ bioWave = 0.0001; }
    if (bioWave > 0){
      bioWave += rawDt / 9;
      if (bioWave >= 1){ bioWave = 0; bioWaveNext = S.t + 30 + Math.random()*25; }
    }
  }

  renderScene();
  updateHUD();
  checkVerse();
}

function renderScene(){
  const depth = S.depth;
  const tint = snowTint(depth);
  const steps = [7, 10, 14][S.quality];
  const torchDir = dirFromNdc(pointerNdc[0], pointerNdc[1], S.torchYaw, S.torchPitch);
  const torchPos = rotCam(0.55, -0.72, 0.10, S.torchYaw, S.torchPitch);
  const waveEnv = bioWave > 0 ? Math.sin(bioWave*Math.PI) : 0;

  gl.clearColor(0.004, 0.008, 0.016, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);

  // ---- PASS 1 水体 ----
  gl.blendFunc(gl.ONE, gl.ZERO);
  gl.useProgram(waterProg);
  gl.uniform2f(wl.uRes, W, H);
  gl.uniform1f(wl.uT, S.t);
  gl.uniform1f(wl.uDepth, depth);
  gl.uniform1f(wl.uYaw, S.yaw);
  gl.uniform1f(wl.uPitch, S.pitch);
  gl.uniform1f(wl.uFov, S.fov);
  gl.uniform3fv(wl.uSun, curSun);
  gl.uniform3fv(wl.uAmb, curAmb);
  gl.uniform3fv(wl.uGlint, curGlint);
  gl.uniform2fv(wl.uTilt, curTilt);
  gl.uniform1f(wl.uPower, curPower);
  gl.uniform1i(wl.uSteps, steps);
  gl.uniform2f(wl.uFlow, S.flowX, S.flowY);
  gl.uniform1f(wl.uTorch, S.torch);
  gl.uniform3fv(wl.uTorchDir, torchDir);
  gl.uniform3fv(wl.uTorchPos, torchPos);
  gl.uniform4f(wl.uWhale, whaleEv.prog, whaleEv.active, whaleEv.size, whaleEv.yOff);
  gl.uniform1f(wl.uWhaleSide, whaleEv.side);
  gl.uniform1f(wl.uBioWave, waveEnv);
  gl.uniform1f(wl.uBioT, bioWave);
  gl.bindVertexArray(quadVAO);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // ---- PASS 2 海洋雪 ----
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  gl.useProgram(snowProg);
  gl.uniform2f(sl.uRes, W, H);
  gl.uniform1f(sl.uT, S.t);
  gl.uniform1f(sl.uFall, snowFall);
  gl.uniform1f(sl.uYaw, S.yaw);
  gl.uniform1f(sl.uPitch, S.pitch);
  gl.uniform1f(sl.uDepth, depth);
  gl.uniform1f(sl.uBox, BOX);
  gl.uniform1f(sl.uFov, S.fov);
  gl.uniform2f(sl.uFlow, S.flowX, S.flowY);
  gl.uniform1f(sl.uTorch, S.torch);
  gl.uniform3fv(sl.uTorchDir, torchDir);
  gl.uniform3fv(sl.uTorchPos, torchPos);
  gl.uniform1f(sl.uStretch, S.stretch);
  gl.uniform3fv(sl.uTint, tint);
  gl.bindVertexArray(snowVAO);
  gl.drawArrays(gl.POINTS, 0, Math.floor(SNOW_N * [0.5, 0.75, 1][S.quality]));

  // ---- PASS 3 生物发光（>250m 才画） ----
  if (depth > 250){
    gl.useProgram(bioProg);
    gl.uniform2f(bl.uRes, W, H);
    gl.uniform1f(bl.uT, S.t);
    gl.uniform1f(bl.uFall, snowFall);
    gl.uniform1f(bl.uYaw, S.yaw);
    gl.uniform1f(bl.uPitch, S.pitch);
    gl.uniform1f(bl.uDepth, depth);
    gl.uniform1f(bl.uBox, BOX);
    gl.uniform1f(bl.uFov, S.fov);
    gl.uniform3fv(bl.uPokeDir, pokeDir);
    gl.uniform1f(bl.uPokeT, pokeT);
    gl.uniform1f(bl.uBioWave, waveEnv);
    gl.uniform1f(bl.uBioT, bioWave);
    gl.uniform1f(bl.uRM, RM ? 1 : 0);
    gl.bindVertexArray(bioVAO);
    gl.drawArrays(gl.POINTS, 0, BIO_N);
  }
  gl.bindVertexArray(null);
}

/* =========================================================
   交互
   ========================================================= */
let moved = false;
let lastMx = 0, lastMy = 0, lastMt = 0;

function onMove(nx, ny){
  const now = performance.now();
  S.lastInput = now;
  // 指针速度 → 水流（低通在主循环衰减）
  if (lastMt){
    const dt = Math.max((now - lastMt)/1000, 0.004);
    const vx = (nx - lastMx)/dt, vy = (ny - lastMy)/dt;
    S.flowX = Math.max(-1.2, Math.min(1.2, S.flowX + vx*0.045));
    S.flowY = Math.max(-1.2, Math.min(1.2, S.flowY - vy*0.045));
    // 快速指向 → 惊扰生物
    if (Math.hypot(vx, vy) > 2.6 && pokeT > 1.2){
      pokeT = 0;
      pokeDir = dirFromNdc(nx, ny, S.yaw, S.pitch);
    }
  }
  lastMx = nx; lastMy = ny; lastMt = now;
  pointerNdc = [nx, ny];
  S.tYaw = nx * 0.55;
  S.tPitch = ny * 0.42;
  if (!moved){ moved = true; document.body.classList.add('moved'); }
}
addEventListener('mousemove', e=>{
  onMove((e.clientX/innerWidth)*2-1, -((e.clientY/innerHeight)*2-1));
});

// 按住 = 探照灯
addEventListener('mousedown', e=>{ if (S.started){ S.tTorch = 1; S.lastInput = performance.now(); } });
addEventListener('mouseup',   ()=>{ S.tTorch = 0; });
addEventListener('mouseleave',()=>{ S.tTorch = 0; });

// 触摸：单指环顾+探照灯；双指竖滑控潜速
let touchMode = 0, pinchY = 0;
addEventListener('touchstart', e=>{
  if (!S.started) return;
  S.lastInput = performance.now();
  if (e.touches.length >= 2){ touchMode = 2; pinchY = (e.touches[0].clientY + e.touches[1].clientY)/2; S.tTorch = 0; }
  else { touchMode = 1; S.tTorch = 1; }
}, {passive:true});
addEventListener('touchmove', e=>{
  if (!e.touches[0]) return;
  if (touchMode === 2 && e.touches.length >= 2){
    const y = (e.touches[0].clientY + e.touches[1].clientY)/2;
    S.vMul = Math.max(0, Math.min(4, S.vMul + (pinchY - y)*0.012));
    pinchY = y;
    S.lastInput = performance.now();
    return;
  }
  const t = e.touches[0];
  onMove((t.clientX/innerWidth)*2-1, -((t.clientY/innerHeight)*2-1));
}, {passive:true});
addEventListener('touchend', e=>{
  if (e.touches.length === 0){ touchMode = 0; S.tTorch = 0; }
}, {passive:true});

addEventListener('wheel', e=>{
  S.vMul = Math.max(0, Math.min(4, S.vMul - e.deltaY*0.0016));
  S.lastInput = performance.now();
}, {passive:true});

// 页面不可见 → 暂停
document.addEventListener('visibilitychange', ()=>{
  S.paused = document.hidden;
  if (!S.paused) S.lastFrame = performance.now();
});

// 退出：按钮 / Esc
document.getElementById('exit-btn').addEventListener('click', ()=>{
  if (document.fullscreenElement && document.exitFullscreen){
    document.exitFullscreen().catch(()=>{}).finally(()=>{ location.href = '/portfolio'; });
  } else {
    location.href = '/portfolio';
  }
});
addEventListener('keydown', e=>{
  if (e.key === 'Escape' && S.started && !document.fullscreenElement) location.href = '/portfolio';
});
document.addEventListener('fullscreenchange', ()=>{
  // Esc 退出全屏后：若用户已交互过（moved 会隐藏原提示），复用 hint 提示返回路径
  if (S.started && !document.fullscreenElement){
    const h = document.getElementById('hint');
    if (h && document.body.classList.contains('moved')){
      h.textContent = '点击顶部「返回作品集」或按 Esc 退出';
      h.style.opacity = '0.6';
      setTimeout(()=>{ h.style.opacity = '0'; }, 5200);
    }
  }
});

/* =========================================================
   开场
   ========================================================= */
document.querySelectorAll('.time-opt').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.time-opt').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    S.timeMode = btn.dataset.t;
    applyTime();
  });
});
function applyTime(){
  const tm = TIMES[S.timeMode];
  curSun=tm.sun.slice(); curAmb=tm.amb.slice(); curGlint=tm.glint.slice();
  curTilt=tm.tilt.slice(); curPower=tm.power;
}
applyTime();

// 潜水编号（本地彩蛋）
try {
  const n = (parseInt(localStorage.biolumeDives || '0', 10) || 0) + 1;
  document.getElementById('diveNo').textContent = 'DIVE ' + String(n).padStart(2, '0');
} catch(e){}

document.getElementById('dive-btn').addEventListener('click', async ()=>{
  try { if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); } catch(e){}
  try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape').catch(()=>{}); } catch(e){}
  try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch(e){}
  try { localStorage.biolumeDives = String((parseInt(localStorage.biolumeDives || '0', 10) || 0) + 1); } catch(e){}

  document.getElementById('start-mask').classList.add('hidden');
  document.body.classList.add('diving');
  S.lastInput = performance.now();
  S.started = true;
});

requestAnimationFrame(frame);
</script>
